<div class="container">
  <form class="row g-3" (submit)="SearchProduit($event)">
    <div class="form-group">
      <label for="name">nom de produit:</label>
      <input type="text" class="form-control" id="name" [field]="shearchForm.name" />
    </div>
    <div class="form-group">
      <label for="stock">Stock:</label>
      <input type="number" class="form-control" id="Stock" [field]="shearchForm.stock" />
    </div>
    <div class="form-group">
      <label for="prix">Prix:</label>
      <input type="number" class="form-control" id="Prix" [field]="shearchForm.price" />
    </div>
    <button type="submit" class="btn btn-success mb-3">Recherche</button>
  </form>
</div>
